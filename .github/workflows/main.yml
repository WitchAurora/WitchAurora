name: Reinstall Homebrew Workflow

on:
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  reinstall-brew:
    runs-on: macos-26-intel
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Uninstall existing Homebrew
        run: |
          echo "Running official Homebrew uninstaller..."
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/uninstall.sh)"

      - name: Clean up residual files
        run: |
          echo "Purging leftover directories..."
          sudo rm -rf /usr/local/Homebrew /usr/local/Caskroom /usr/local/Cellar /usr/local/var/homebrew
          sudo rm -rf /opt/homebrew/* # Just in case runner has remnants

      - name: Install latest Homebrew
        run: |
          echo "Installing latest Homebrew..."
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      - name: Verify installation
        run: |
          # Add brew to PATH for runner shell session
          echo "/opt/homebrew/bin" >> $GITHUB_PATH || echo "/usr/local/bin" >> $GITHUB_PATH
          brew --version
          brew update
