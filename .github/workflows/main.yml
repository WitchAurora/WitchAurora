name: Verify Raw Pre-Installed Java Architecture

on: [push, workflow_dispatch]

jobs:
  verify-native-env:
    runs-on: windows-11-arm  # Or use 'windows-11-vs2026-arm'
    steps:
      - name: Inspect Pre-installed Environment
        shell: powershell
        run: |
          echo "==== Runner Environment ===="
          echo "Runner Architecture: $env:RUNNER_ARCH"
          echo "Default JAVA_HOME Path: $env:JAVA_HOME"
          
          echo "`n==== Executing Java Architecture Probe ===="
          (& "$env:JAVA_HOME\bin\java.exe" -XshowSettings:properties -version) 2>&1 | Select-String "os.arch|sun.arch.data.model"
