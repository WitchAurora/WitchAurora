name: Diagnostic PowerShell Image

on: [workflow_dispatch] # Permet le déclenchement manuel depuis l'onglet Actions

jobs:
  check-powershell:
    runs-on: windows-2025 # Cible l'image Windows Server 2025

    steps:
      - name: 'Étape 1 : Vérification de la version active'
        shell: pwsh
        run: |
          Write-Host "=== Version système par défaut ==="
          $PSVersionTable
          
          Write-Host "`n=== Version brute de pwsh ==="
          pwsh --version

      - name: 'Étape 2 : Inspection des dossiers système'
        shell: pwsh
        run: |
          Write-Host "=== Emplacement du binaire ==="
          Get-Command pwsh | Select-Object Name, Source
          
          Write-Host "`n=== Versions sur le disque (C:\Program Files\PowerShell) ==="
          if (Test-Path "C:\Program Files\PowerShell") {
              Get-ChildItem "C:\Program Files\PowerShell" | Select-Object Name, FullName
          } else {
              Write-Warning "Le dossier C:\Program Files\PowerShell est introuvable."
          }
