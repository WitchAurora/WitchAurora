name: Verify Raw Pre-Installed Java Architecture

on: [push, workflow_dispatch]

jobs:
  verify-native-env:
    runs-on: windows-11-arm  # Or use 'windows-11-vs2026-arm'
    steps:
      - name: Inspect Pre-installed Environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          
          Write-Host "==== Runner Environment ===="
          Write-Host "Runner Architecture: $env:RUNNER_ARCH"
          Write-Host "Default JAVA_HOME Path: $env:JAVA_HOME"
          
          Write-Host "`n==== Executing Java Architecture Probe ===="
          $output = & "$env:JAVA_HOME\bin\java.exe" -XshowSettings:properties -version 2>&1
          $output | Select-String "os.arch|sun.arch.data.model"
          
          exit 0
