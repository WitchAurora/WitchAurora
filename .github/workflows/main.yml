name: Android CMake ARM Toolset Workflow

on:
  workflow_dispatch:

jobs:
  verify-toolset:
    runs-on: windows-11-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java SDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android Environment Variables
        run: |
          $androidHome = "$env:USERPROFILE\AppData\Local\Android\Sdk"
          echo "ANDROID_HOME=$androidHome" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "ANDROID_SDK_ROOT=$androidHome" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force -Path "$androidHome\cmake" | Out-Null
        shell: pwsh

      - name: Download CMake Tools from Kitware
        run: |
          $versions = @("3.22.1", "3.31.5", "4.1.2")
          foreach ($v in $versions) {
              $cmakeDir = "$env:ANDROID_HOME\cmake\$v"
              Write-Host "=== Downloading CMake $v from Kitware ==="
              
              $url = "https://github.com/Kitware/CMake/releases/download/v$v/cmake-$v-windows-x86_64.zip"
              $zipPath = "$env:TEMP\cmake-$v.zip"
              
              try {
                  [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
                  Invoke-WebRequest -Uri $url -OutFile $zipPath
                  
                  if (Test-Path $cmakeDir) {
                      Remove-Item $cmakeDir -Recurse -Force
                  }
                  New-Item -ItemType Directory -Force -Path $cmakeDir | Out-Null
                  
                  Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP\cmake-temp-$v" -Force
                  $extractedFolder = Get-ChildItem "$env:TEMP\cmake-temp-$v" | Select-Object -ExpandProperty FullName
                  Copy-Item "$extractedFolder\*" -Destination $cmakeDir -Recurse -Force
                  
                  Remove-Item $zipPath -ErrorAction SilentlyContinue
                  Remove-Item "$env:TEMP\cmake-temp-$v" -Recurse -ErrorAction SilentlyContinue
                  Write-Host "Successfully installed CMake $v."
              } catch {
                  Write-Host "Failed to download CMake $v: $_"
                  exit 1
              }
          }
        shell: pwsh

      - name: Verify CMake Installations
        run: |
          Write-Host "=== Verifying CMake 3.22.1 ==="
          & "$env:ANDROID_HOME\cmake\3.22.1\bin\cmake.exe" --version
          
          Write-Host "=== Verifying CMake 3.31.5 ==="
          & "$env:ANDROID_HOME\cmake\3.31.5\bin\cmake.exe" --version
          
          Write-Host "=== Verifying CMake 4.1.2 ==="
          & "$env:ANDROID_HOME\cmake\4.1.2\bin\cmake.exe" --version
        shell: pwsh
