name: Java 25 Windows 11 ARM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-11-arm
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25 (Azul Zulu)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          architecture: 'aarch64'

      - name: Verify Java Architecture and Version
        run: |
          java --version
          javac --version
