name: Download CMake

on:
  workflow_dispatch:

jobs:
  download-cmake:
    runs-on: windows-latest
    steps:
      - name: Download Native ARM64 CMake Tools from Kitware
        run: |
          $versions = @("3.30.5", "3.31.5", "4.1.2")
          foreach ($v in $versions) {
              $cmakeDir = "$env:ANDROID_HOME\cmake\$v"
              Write-Host "=== Downloading native ARM64 CMake $v from Kitware ==="
                            
              $url = "https://github.com/Kitware/CMake/releases/download/v$v/cmake-$v-windows-arm64.zip"
              $zipPath = "$env:TEMP\cmake-$v-arm64.zip"
                            
              try {
                  [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
                  Invoke-WebRequest -Uri $url -OutFile $zipPath
                                    
                  if (Test-Path $cmakeDir) {
                      Remove-Item $cmakeDir -Recurse -Force
                  }
                  New-Item -ItemType Directory -Force -Path $cmakeDir | Out-Null
                                    
                  Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP\cmake-temp-$v" -Force
                  $extractedFolder = Get-ChildItem "$env:TEMP\cmake-temp-$v" | Select-Object -ExpandProperty FullName
                  Copy-Item "$extractedFolder\*" -Destination $cmakeDir -Recurse -Force
                                    
                  Remove-Item $zipPath -ErrorAction SilentlyContinue
                  Remove-Item "$env:TEMP\cmake-temp-$v" -Recurse -Force
                  Write-Host "Successfully installed native ARM64 CMake $v."
              } catch {
                  Write-Host "Failed to download native ARM64 CMake ${v}: $_"
                  exit 1
              }
          }
        shell: pwsh
