name: Reinstall Homebrew Workflow

on:
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  reinstall-brew:
    runs-on: macos-26-intel  # Valid Intel runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Uninstall existing Homebrew
        run: |
          echo "Running official Homebrew uninstaller..."
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/uninstall.sh)" || true

      - name: Clean up residual files
        run: |
          echo "Purging leftover directories..."
          sudo rm -rf /usr/local/Homebrew /usr/local/Caskroom /usr/local/Cellar /usr/local/var/homebrew

      - name: Install Homebrew via Shell Script (Intel)
        run: |
          echo "Installing Homebrew for Intel..."
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      - name: Verify installation
        run: |
          # Add brew to PATH for Intel runner shell session
          echo "/usr/local/bin" >> $GITHUB_PATH
          echo "/usr/local/sbin" >> $GITHUB_PATH
          
          # Force ownership to the current runner user
          sudo chown -R $USER:admin /usr/local/Homebrew
          
          brew --version
          brew update
