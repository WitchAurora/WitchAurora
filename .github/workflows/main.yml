name: Android CMake ARM Toolset Workflow

on:
  workflow_dispatch:

jobs:
  verify-toolset:
    runs-on: windows-11-arm
    env:
      TOOL_CONFIG: |
        {
          "addons": [],
          "additional_tools": [
            "cmake;3.22.1",
            "cmake;3.31.5",
            "cmake;4.1.2"
          ]
        }
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Load Config and Install CMake Tools via sdkmanager
        run: |
          Write-Host "Loading configuration payload:"
          Write-Host "$env:TOOL_CONFIG"
          
          $env:ANDROID_SDK_ROOT = $env:ANDROID_HOME
          $sdkManagerPath = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path $sdkManagerPath)) {
              $sdkManagerPath = "sdkmanager"
          }

          Write-Host "Accepting SDK licenses..."
          $yesInput = "y`n" * 15
          $yesInput | & $sdkManagerPath --licenses

          Write-Host "Installing all CMake versions via sdkmanager..."
          & $sdkManagerPath "cmake;3.22.1" "cmake;3.31.5" "cmake;4.1.2"
        shell: pwsh

      - name: Verify CMake Installations
        run: |
          Write-Host "=== Verifying CMake 3.22.1 ==="
          & "$env:ANDROID_HOME\cmake\3.22.1\bin\cmake.exe" --version
          
          Write-Host "=== Verifying CMake 3.31.5 ==="
          & "$env:ANDROID_HOME\cmake\3.31.5\bin\cmake.exe" --version
          
          Write-Host "=== Verifying CMake 4.1.2 ==="
          $cmake4Path = "$env:ANDROID_HOME\cmake\4.1.2\bin\cmake.exe"
          if (Test-Path $cmake4Path) {
              & $cmake4Path --version
          } else {
              Write-Host "CMake 4.1.2 path not found in standard Android SDK location."
          }
        shell: pwsh
