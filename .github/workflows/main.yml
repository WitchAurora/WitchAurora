name: Android CMake ARM Toolset Workflow

on:
  workflow_dispatch:

jobs:
  verify-toolset:
    runs-on: windows-11-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Update SDK Tools and Install All CMake Versions
        run: |
          $env:ANDROID_SDK_ROOT = $env:ANDROID_HOME
          $sdkManagerPath = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path $sdkManagerPath)) {
              $sdkManagerPath = "sdkmanager"
          }

          Write-Host "Accepting SDK licenses..."
          $yesInput = "y`n" * 20
          $yesInput | & $sdkManagerPath --licenses

          Write-Host "Updating command-line tools to support newer package metadata..."
          $yesInput | & $sdkManagerPath --update

          Write-Host "Installing CMake 3.22.1, 3.31.5, and 4.1.2 via sdkmanager..."
          & $sdkManagerPath "cmake;3.22.1" "cmake;3.31.5" "cmake;4.1.2"
        shell: pwsh

      - name: Verify CMake Installations
        run: |
          Write-Host "=== Verifying CMake 3.22.1 ==="
          & "$env:ANDROID_HOME\cmake\3.22.1\bin\cmake.exe" --version
          
          Write-Host "=== Verifying CMake 3.31.5 ==="
          & "$env:ANDROID_HOME\cmake\3.31.5\bin\cmake.exe" --version
          
          Write-Host "=== Verifying CMake 4.1.2 ==="
          & "$env:ANDROID_HOME\cmake\4.1.2\bin\cmake.exe" --version
        shell: pwsh
