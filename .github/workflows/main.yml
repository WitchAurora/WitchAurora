
name: Install Java 25 from Oracle Website

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-11-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download and Setup from Oracle Website
        shell: powershell
        run: |
          $url = "https://download.oracle.com/java/25/latest/jdk-25_windows-x64_bin.zip"
          $zipPath = "$env:TEMP\jdk-25.zip"
          $installDir = "C:\Program Files\Java"
          Write-Host "Downloading archive directly from Oracle..."
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Write-Host "Extracting files to $installDir..."
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          Expand-Archive -Path $zipPath -DestinationPath $installDir -Force
          $jdkFolder = Get-ChildItem -Path $installDir -Filter "jdk-25*" | Select-Object -ExpandProperty FullName | Select-Object -First 1
          Write-Host "Resolved JDK path: $jdkFolder"
          echo "JAVA_HOME=$jdkFolder" >> $env:GITHUB_ENV
          echo "$jdkFolder\bin" >> $env:GITHUB_PATH
      - name: Verify Java Setup
        shell: powershell
        run: |
          java -version
          javac -version
