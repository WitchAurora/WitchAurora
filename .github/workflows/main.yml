name: Setup Android CMake

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download CMake Tools from Kitware
        run: |
          $versions = @("3.22.1", "3.31.5", "4.1.2")
          foreach ($v in $versions) {
              $cmakeDir = "$env:ANDROID_HOME\cmake\$v"
              $tempDir = "$env:TEMP\cmake-temp-$v"
              Write-Host "=== Downloading CMake $v from Kitware ==="
                            
              $url = "https://github.com/Kitware/CMake/releases/download/v$v/cmake-$v-windows-x86_64.zip"
              $zipPath = "$env:TEMP\cmake-$v.zip"
                            
              try {
                  [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
                  Invoke-WebRequest -Uri $url -OutFile $zipPath
                                    
                  if (Test-Path $cmakeDir) { Remove-Item $cmakeDir -Recurse -Force }
                  New-Item -ItemType Directory -Force -Path $cmakeDir | Out-Null
                  
                  if (Test-Path $tempDir) { Remove-Item $tempDir -Recurse -Force }
                                    
                  Expand-Archive -Path $zipPath -DestinationPath $tempDir -Force
                  $extractedFolder = Get-ChildItem $tempDir | Select-Object -ExpandProperty FullName
                  Copy-Item "$extractedFolder\*" -Destination $cmakeDir -Recurse -Force
                                    
                  Remove-Item $zipPath -ErrorAction SilentlyContinue
                  Remove-Item $tempDir -Recurse -Force -ErrorAction SilentlyContinue
                  Write-Host "Successfully installed CMake $v."
              } catch {
                  Write-Host "Failed to download CMake ${v}: $_"
                  exit 1
              }
          }
