name: Ultimate Repro Issue 14728

on:
  workflow_dispatch:

jobs:
  run-repro:
    runs-on: windows-11-arm
    steps:
      - name: Hardened TrustedPublisher Test
        shell: pwsh
        run: |
          $code = @"
          using System;
          using System.Security.Cryptography;
          using System.Security.Cryptography.X509Certificates;

          public class ReproTester {
              public static void Execute() {
                  try {
                      Console.WriteLine("--- Phase 1: Creating OS-Backed Key Container ---");
                      
                      // On force la création des clés dans le stockage persistant de Windows (CNG)
                      CngKeyCreationParameters keyParams = new CngKeyCreationParameters {
                          Provider = CngProvider.MicrosoftSoftwareKeyStorageProvider,
                          KeyCreationOptions = CngKeyCreationOptions.OverwriteExistingKey
                      };
                      
                      using (CngKey cngKey = CngKey.Create(CngAlgorithm.Rsa, "ReproKey14728", keyParams))
                      using (RSA rsa = new RSACng(cngKey)) {
                          var request = new CertificateRequest(
                              "CN=Authenticode Repro Publisher",
                              rsa,
                              HashAlgorithmName.SHA256,
                              RSASignaturePadding.Pkcs1);

                          request.CertificateExtensions.Add(
                              new X509EnhancedKeyUsageExtension(
                                  new OidCollection { new Oid("1.3.6.1.5.5.7.3.3") }, 
                                  false));

                          X509Certificate2 cert = request.CreateSelfSigned(
                              DateTimeOffset.UtcNow.AddDays(-1),
                              DateTimeOffset.UtcNow.AddYears(1));

                          Console.WriteLine($"[OK] OS-Backed Certificate generated. Thumbprint: {cert.Thumbprint}");

                          Console.WriteLine("\n--- Phase 2: Direct Target Bug Operation ---");
                          Console.WriteLine("Opening CurrentUser\\TrustedPublisher as ReadWrite...");
                          
                          using (X509Store pubStore = new X509Store(StoreName.TrustedPublisher, StoreLocation.CurrentUser)) {
                              pubStore.Open(OpenFlags.ReadWrite);
                              Console.WriteLine("[OK] Store opened. Invoking pubStore.Add()...");
                              
                              pubStore.Add(cert);
                              Console.WriteLine("\n[RESULT] SUCCESS: Certificate written. Bug was NOT reproduced.");
                          }
                      }
                  }
                  catch (Exception ex) {
                      Console.WriteLine("\n================================================");
                      Console.WriteLine("!!! BUG REPRODUCTION DETECTED !!!");
                      Console.WriteLine("================================================");
                      Console.WriteLine(ex.ToString());
                      
                      if (ex.HResult == unchecked((int)0x80070005)) {
                          Console.WriteLine("\nVerified Native Error Code: 0x80070005 (Access is Denied).");
                      }
                  }
              }
          }
          "@

          Add-Type -TypeDefinition $code -Language CSharp
          [ReproTester]::Execute()
