name: Intel macOS Homebrew Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  brew-workflow:
    runs-on: macos-15-large

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Perform Brew Update
        run: |
          brew update-reset || brew update

      - name: Run Brew Workflow Tasks
        run: |
          brew upgrade
          # Add your custom brew commands here (e.g., brew install <package>)

      - name: Cleanup Homebrew Cache
        run: |
          brew cleanup --prune=all
