name: Android CMake ARM Toolset Workflow

on:
  workflow_dispatch:

jobs:
  verify-toolset:
    runs-on: windows-11-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java SDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install CMake Tools via sdkmanager
        run: |
          $env:ANDROID_SDK_ROOT = $env:ANDROID_HOME
          $sdkManagerPath = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path $sdkManagerPath)) {
              $sdkManagerPath = "$env:ANDROID_HOME\cmdline-tools\16.0\bin\sdkmanager.bat"
          }

          Write-Host "Accepting SDK licenses..."
          $processInfo = New-Object System.Diagnostics.ProcessStartInfo
          $processInfo.FileName = "cmd.exe"
          $processInfo.RedirectStandardInput = $true
          $processInfo.UseShellExecute = $false
          $processInfo.Arguments = "/c `"$sdkManagerPath`" --licenses"
          
          $p = [System.Diagnostics.Process]::Start($processInfo)
          $p.StandardInput.WriteLine(($y="y`n") * 30)
          $p.StandardInput.Close()
          $p.WaitForExit()

          Write-Host "Installing packages..."
          & "$sdkManagerPath" "cmake;3.22.1" --include_obs
          & "$sdkManagerPath" "cmake;3.31.5" "cmake;4.1.2" --channel=3
        shell: pwsh

      - name: Verify CMake Installations
        run: |
          Write-Host "=== Verifying CMake 3.22.1 ==="
          & "$env:ANDROID_HOME\cmake\3.22.1\bin\cmake.exe" --version
          
          Write-Host "=== Verifying CMake 3.31.5 ==="
          & "$env:ANDROID_HOME\cmake\3.31.5\bin\cmake.exe" --version
          
          Write-Host "=== Verifying CMake 4.1.2 ==="
          & "$env:ANDROID_HOME\cmake\4.1.2\bin\cmake.exe" --version
        shell: pwsh
