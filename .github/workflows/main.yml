name: Repro Issue 14728

on:
  workflow_dispatch: # Allows manual triggering for testing

jobs:
  reproduce-error:
    runs-on: windows-11-arm
    steps:
      - name: Attempt X509Store.Add to CurrentUser TrustedPublisher
        shell: pwsh
        run: |
          # 1. Create a transient self-signed certificate in memory
          Write-Host "Creating a transient self-signed certificate..."
          $cert = New-SelfSignedCertificate -Subject "CN=Repro14728" -CertStoreLocation "Cert:\CurrentUser\My"
          
          # 2. Open the CurrentUser TrustedPublisher store with ReadWrite permissions
          Write-Host "Opening X509Store (TrustedPublisher, CurrentUser) in ReadWrite mode..."
          $store = [System.Security.Cryptography.X509Certificates.X509Store]::new(
              [System.Security.Cryptography.X509Certificates.StoreName]::TrustedPublisher,
              [System.Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser
          )
          
          try {
              $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
              
              # 3. Attempt to add the certificate to reproduce the 0x80070005 Access Denied error
              Write-Host "Attempting to add the certificate..."
              $store.Add($cert)
              
              Write-Host "SUCCESS: Certificate added without errors. The issue might be resolved." -ForegroundColor Green
          }
          catch [System.Security.Cryptography.CryptographicException] {
              Write-Host "CAUGHT EXPECTED ERROR:" -ForegroundColor Red
              Write-Host $_.Exception.Message -ForegroundColor Red
              
              # Extract the HRESULT to verify it matches 0x80070005
              $hresult = "0x{0:X8}" -f $_.Exception.HResult
              Write-Host "HRESULT: $hresult" -ForegroundColor Red
              
              if ($hresult -eq "0x80070005") {
                  Write-Host "CRITICAL: Successfully reproduced 0x80070005 (Access Denied)!" -ForegroundColor Yellow
              } else {
                  Write-Host "Failed with a different HRESULT: $hresult" -ForegroundColor Orange
                  exit 1
              }
          }
          finally {
              # Clean up the store connection and the transient certificate
              $store.Close()
              Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -ErrorAction SilentlyContinue
          }
