name: Repro Issue 14728 - Clean

on:
  workflow_dispatch:

jobs:
  repro-exact:
    runs-on: windows-11-arm
    steps:
      - name: Generate and Install Baseline Certificate
        shell: pwsh
        run: |
          # 1. Generate a standard code-signing certificate in the user context
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject "CN=Authenticode Test Publisher" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Repro 14728 Baseline" `
            -CertStoreLocation "Cert:\CurrentUser\My"

          # 2. Replicate issue conditions: copy it to Root as seen in the bug report
          $rootStore = New-Object System.Security.Cryptography.X509Certificates.X509Store("Root", "CurrentUser")
          $rootStore.Open("ReadWrite")
          $rootStore.Add($cert)
          $rootStore.Close()

          echo "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          Write-Host "Injected certificate into My and Root stores. Thumbprint: $($cert.Thumbprint)"

      - name: Execute Native .NET App (X509Store.Add)
        shell: pwsh
        run: |
          # Build a clean native .NET app targeting the exact API call
          $code = @"
          using System;
          using System.Security.Cryptography.X509Certificates;

          class Program {
              static void Main(string[] args) {
                  string thumbprint = args[0];
                  
                  using (X509Store myStore = new X509Store(StoreName.My, StoreLocation.CurrentUser)) {
                      myStore.Open(OpenFlags.ReadOnly);
                      X509Certificate2Collection matches = myStore.Certificates.Find(X509FindType.FindByThumbprint, thumbprint, false);
                      
                      if (matches.Count == 0) {
                          Console.WriteLine("Error: Source certificate not found.");
                          Environment.Exit(1);
                      }
                      
                      X509Certificate2 targetCert = matches[0];
                      
                      try {
                          Console.WriteLine("Attempting to open CurrentUser\\TrustedPublisher ReadWrite...");
                          using (X509Store pubStore = new X509Store(StoreName.TrustedPublisher, StoreLocation.CurrentUser)) {
                              pubStore.Open(OpenFlags.ReadWrite);
                              
                              Console.WriteLine("Attempting to Add the certificate to TrustedPublisher...");
                              pubStore.Add(targetCert);
                              
                              Console.WriteLine("SUCCESS: Certificate added. The bug did not reproduce.");
                          }
                      }
                      catch (Exception ex) {
                          Console.WriteLine("=== BUG REPRODUCTION DETECTED ===");
                          Console.WriteLine(ex.ToString());
                          
                          if (ex.HResult == unchecked((int)0x80070005)) {
                              Console.WriteLine("Confirmed Error Code: 0x80070005 (Access is Denied).");
                              Environment.Exit(0); // Exit clean because we caught the expected platform bug
                          }
                          Environment.Exit(1);
                      }
                  }
              }
          }
          "@
          
          # Compile and run natively
          $code | Out-File -FilePath Program.cs -Encoding utf8
          dotnet new console --force --name ReproRunner
          Move-Item -Path Program.cs -Destination ReproRunner\Program.cs -Force
          cd ReproRunner
          dotnet run -- ${{ env.CERT_THUMBPRINT }}
